<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Real Block Breaker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=JetBrains+Mono:wght@800&display=swap">
<style>
  html, body {
    margin: 0; height: 100%; background: #0c0e11; color: #e6e9ee;
    font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(ellipse at 50% 30%, #1d2126 0%, #0c0e11 70%); }
  canvas { display: block; box-shadow: 0 40px 90px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.04); border-radius: 8px; cursor: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             background: rgba(5,6,8,.74); text-align: center; padding: 24px; backdrop-filter: blur(2px); }
  .overlay h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: .06em; color: #dff6ff; text-shadow: 0 0 18px rgba(143,216,255,.55), 0 2px 0 #1a2a36, 0 6px 20px rgba(0,0,0,.6); }
  .overlay p { max-width: 460px; line-height: 1.7; margin: 6px 0; font-size: 15px; color: #cfd6de; }
  .overlay .score { font-size: 54px; font-weight: 800; color: #fff; margin: 8px 0 2px; font-variant-numeric: tabular-nums; }
  .overlay .best { font-size: 14px; color: #8fa6b8; margin-bottom: 14px; }
  button { margin-top: 18px; font-size: 18px; padding: 12px 34px; border-radius: 999px; border: 2px solid #9aa3ab; cursor: pointer;
           background: linear-gradient(#e6eaee, #9aa3ab); color: #14181c; font-weight: 700; letter-spacing: .05em;
           box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.85); }
  button:active { transform: translateY(2px); }
  .hidden { display: none !important; }
  .kbd { display: inline-block; padding: 1px 7px; border: 1px solid #5f6873; border-radius: 4px; font-size: 12px; background: #1a1f25; }
  #mute { position: absolute; top: 10px; right: 12px; margin: 0; padding: 6px 12px; font-size: 13px; opacity: .8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="start" class="overlay">
    <h1>REAL BLOCK BREAKER</h1>
    <p>鋼の筐体の中を転がる銀色の玉で、制限時間内にできるだけ多くのブロックを砕こう。</p>
    <p>画面の下は壁になっていて玉は落ちません。下の壁にある<b>クロームのディフレクター</b>を左右に動かし、玉がそこに当たると<b>当たった位置に応じた角度</b>で打ち出されます。狙った方向へ玉を誘導しよう。</p>
    <p>ディフレクター以外の壁に当たるとコンボが途切れます。全ブロックを消すとボーナス得点と時間延長 (+10秒)、新しいブロック群が現れ、玉が1個追加されます（最大3個）。</p>
    <p><span class="kbd">マウス / タッチ</span> または <span class="kbd">← →</span> <span class="kbd">A D</span> で操作 &nbsp; <span class="kbd">M</span> でミュート</p>
    <button id="startBtn">スタート</button>
  </div>
  <div id="over" class="overlay hidden">
    <h1>TIME UP</h1>
    <div class="score" id="finalScore">0</div>
    <div class="best" id="finalBest"></div>
    <p id="finalStats"></p>
    <button id="retryBtn">もう一度</button>
  </div>
  <button id="mute">🔊</button>
</div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const W = 600, H = 880;            // logical canvas size
const HUD_H = 76;                  // top plaque
const WALL = 28;                   // steel rail thickness
const L = WALL, Rgt = W - WALL, T = HUD_H + WALL, B = H - WALL;  // interior bounds
const R = 13;                      // ball radius
const BASE_SPEED = 520, MAX_SPEED = 960, MIN_SPEED = 340;
const WAVE_TIME_BONUS = 10;        // seconds added on a full clear
const ZONE_W = 150;                // deflector width
const ZONE_MAX_ANGLE = 68 * Math.PI / 180;
const TIME_LIMIT = 90;
const MAX_BALLS = 3;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const PALETTE = [
  { name: 'red',    base: '#c8412f', light: '#e8735f', dark: '#7d2418' },
  { name: 'orange', base: '#e07b28', light: '#f5a45c', dark: '#8f4a12' },
  { name: 'yellow', base: '#e3b535', light: '#f7d770', dark: '#94711a' },
  { name: 'green',  base: '#5e9e46', light: '#8bc674', dark: '#35622a' },
  { name: 'blue',   base: '#3f7fbf', light: '#71a9de', dark: '#224b78' },
  { name: 'purple', base: '#7e5aa6', light: '#a98acc', dark: '#4a3266' },
];

// ---------------------------------------------------------------- audio
let audio = null, muted = false;
function initAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function noiseBuffer() {
  const len = audio.sampleRate * 0.3, buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
let _noise = null;
function sfx(kind, vol = 1) {
  if (!audio || muted) return;
  if (audio.state === 'suspended') audio.resume();
  const t = audio.currentTime;
  const g = audio.createGain(); g.connect(audio.destination);
  if (kind === 'tile' || kind === 'wall') {
    // steel clank: bright noise burst + short ringing partial
    if (!_noise) _noise = noiseBuffer();
    const src = audio.createBufferSource(); src.buffer = _noise;
    const f = audio.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = kind === 'tile' ? 2600 : 1100; f.Q.value = 2.5;
    src.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.45 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    src.start(t); src.stop(t + 0.08);
    const o = audio.createOscillator(); const og = audio.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(kind === 'tile' ? 1320 : 420, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'tile' ? 980 : 300, t + 0.06);
    og.gain.setValueAtTime(0.22 * vol, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(og); og.connect(audio.destination); o.start(t); o.stop(t + 0.15);
  } else if (kind === 'metal') {
    // chrome deflector ping
    [1, 2.76, 5.4].forEach((m, i) => {
      const o = audio.createOscillator(); const og = audio.createGain();
      o.type = 'sine'; o.frequency.value = 880 * m;
      og.gain.setValueAtTime(0.25 * vol / (i + 1), t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.35 - i * 0.08);
      o.connect(og); og.connect(audio.destination); o.start(t); o.stop(t + 0.4);
    });
  } else if (kind === 'clink') {
    // ball-ball steel clink
    const o = audio.createOscillator(); o.type = 'triangle'; o.frequency.value = 2400;
    g.gain.setValueAtTime(0.25 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    o.connect(g); o.start(t); o.stop(t + 0.07);
  } else if (kind === 'clear') {
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = audio.createOscillator(); const og = audio.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const s = t + i * 0.09;
      og.gain.setValueAtTime(0.0001, s); og.gain.linearRampToValueAtTime(0.3, s + 0.02); og.gain.exponentialRampToValueAtTime(0.001, s + 0.5);
      o.connect(og); og.connect(audio.destination); o.start(s); o.stop(s + 0.55);
    });
  }
}

// ---------------------------------------------------------------- textures
// brushed stainless: base gradient across the brushing direction + many faint scratches along it
function makeBrushedTexture(w, h, stops, vertical, alphaMax, count) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  const g = vertical ? c.createLinearGradient(0, 0, w, 0) : c.createLinearGradient(0, 0, 0, h);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.lineWidth = 1;
  for (let i = 0; i < count; i++) {
    const a = rand(0, alphaMax), light = Math.random() < 0.5;
    c.strokeStyle = light ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`;
    const px = rand(0, w), py = rand(0, h), len = rand(20, 180);
    c.beginPath(); c.moveTo(px, py);
    if (vertical) c.lineTo(px, py + len); else c.lineTo(px + len, py);
    c.stroke();
  }
  return cv;
}
// matte black powder coat: flat base, fine speckle, soft vignette
function makeMatteTexture(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.fillStyle = '#1c1f23'; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.035)';
  for (let i = 0; i < 9000; i++) c.fillRect(rand(0, w), rand(0, h), 1, 1);
  const v = c.createRadialGradient(w / 2, h / 2, 80, w / 2, h / 2, Math.max(w, h) * 0.62);
  v.addColorStop(0, 'rgba(255,255,255,.04)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
  c.fillStyle = v; c.fillRect(0, 0, w, h);
  return cv;
}
const STEEL = [[0, '#9aa1a8'], [0.25, '#d6dbe0'], [0.5, '#aab1b8'], [0.75, '#c9ced4'], [1, '#858c93']];
const LED_WARM = '#ffd9a3';        // warm-white LED strip along the rails
const boardTex = makeMatteTexture(W, H);
const railTexH = makeBrushedTexture(W, WALL, STEEL, false, 0.10, 500);        // top / bottom rails
const railTexV = makeBrushedTexture(WALL, H, STEEL, true, 0.10, 500);         // side rails

function hexBolt(c, x, y, r, tone = '#c9ced4') {
  c.save();
  c.fillStyle = 'rgba(0,0,0,.45)'; c.beginPath(); c.arc(x + 1, y + 1.5, r + 1, 0, Math.PI * 2); c.fill();
  const g = c.createRadialGradient(x - r * 0.4, y - r * 0.4, 1, x, y, r);
  g.addColorStop(0, '#f4f6f8'); g.addColorStop(0.5, tone); g.addColorStop(1, '#4e555c');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  // hex socket
  c.fillStyle = 'rgba(0,0,0,.55)'; c.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3, hr = r * 0.5; c[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * hr, y + Math.sin(a) * hr); }
  c.closePath(); c.fill();
  c.restore();
}

// static background (rails + board + HUD bezel)
const bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
(function drawStaticBackground() {
  const c = bgCanvas.getContext('2d');
  // stainless rails: horizontal brushing on top/bottom, vertical on the sides
  c.drawImage(railTexH, 0, HUD_H); c.drawImage(railTexH, 0, B);
  c.drawImage(railTexV, 0, 0); c.drawImage(railTexV, Rgt, 0);
  // mitre seams at the corners
  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 1;
  [[0, HUD_H, L, T], [W, HUD_H, Rgt, T], [0, H, L, B], [W, H, Rgt, B]].forEach(([x0, y0, x1, y1]) => {
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
  });
  // board interior
  c.save(); c.beginPath(); c.rect(L, T, Rgt - L, B - T); c.clip();
  c.drawImage(boardTex, 0, 0);
  // inner shadow from the rails
  const sh = 18;
  [[L, 0, L + sh, 0], [Rgt, 0, Rgt - sh, 0], [0, T, 0, T + sh], [0, B, 0, B - sh]].forEach(([x0, y0, x1, y1]) => {
    const g = c.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(L, T, Rgt - L, B - T);
  });
  c.restore();
  // rail lip: bright edge on the inside, dark groove a little further out
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1; c.strokeRect(L - 0.5, T - 0.5, Rgt - L + 1, B - T + 1);
  c.strokeStyle = 'rgba(0,0,0,.6)'; c.strokeRect(L - 3.5, T - 3.5, Rgt - L + 7, B - T + 7);
  // warm-white LED strip running just inside the rails
  c.save(); c.lineJoin = 'round';
  for (let i = 2; i >= 1; i--) {
    c.shadowColor = LED_WARM; c.shadowBlur = 8 * i; c.strokeStyle = LED_WARM; c.globalAlpha = 0.5; c.lineWidth = 1.5;
    c.strokeRect(L + 5, T + 5, Rgt - L - 10, B - T - 10);
  }
  c.shadowBlur = 0; c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 0.7;
  c.strokeRect(L + 5, T + 5, Rgt - L - 10, B - T - 10);
  c.restore();
  // hex socket bolts at the corners and mid-rails
  [[14, HUD_H + 14], [W - 14, HUD_H + 14], [14, H - 14], [W - 14, H - 14], [14, (T + B) / 2], [W - 14, (T + B) / 2]]
    .forEach(([x, y]) => hexBolt(c, x, y, 6));
  // HUD bezel: polished chrome with a black glass window
  const pg = c.createLinearGradient(0, 0, 0, HUD_H);
  pg.addColorStop(0, '#e9edf0'); pg.addColorStop(0.18, '#7f868e'); pg.addColorStop(0.5, '#c7ccd1'); pg.addColorStop(0.85, '#5b626a'); pg.addColorStop(1, '#d9dee3');
  c.fillStyle = pg; c.fillRect(0, 0, W, HUD_H);
  c.fillStyle = '#05070c'; roundRect(c, 6, 6, W - 12, HUD_H - 14, 4); c.fill();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(0, 0, W, 1);
})();

// ---------------------------------------------------------------- game state
const state = {
  mode: 'ready',           // ready | playing | over
  score: 0, best: +(localStorage.getItem('rbb_best') || 0),
  time: TIME_LIMIT, wave: 1, combo: 0, maxCombo: 0, blocksBroken: 0,
  zone: { x: W / 2, target: W / 2, vx: 0, flash: 0 },
  balls: [], blocks: [], particles: [], popups: [],
  banner: null, shake: 0, keys: {},
  timeAlive: 0,
};

function newBall(x, y, angle, speed) {
  return { x, y, vx: Math.sin(angle) * speed, vy: -Math.cos(angle) * speed, stuckT: 0, trail: [] };
}
function ballSpeed(b) { return Math.hypot(b.vx, b.vy); }
function setSpeed(b, s) { const cur = ballSpeed(b) || 1; b.vx *= s / cur; b.vy *= s / cur; }
function multiplier() { return 1 + Math.min(7, Math.floor(state.combo / 4)); }
function baseSpeed() { return Math.min(MAX_SPEED * 0.8, BASE_SPEED + (state.wave - 1) * 25); }

// ---------------------------------------------------------------- block layouts
const BW = 60, BH = 26, GAP = 6, COLS = 8;
const GRID_X0 = L + ((Rgt - L) - (COLS * (BW + GAP) - GAP)) / 2;
const GRID_Y0 = T + 34;
function mkBlock(col, row, hp, colorIdx) {
  return { x: GRID_X0 + col * (BW + GAP), y: GRID_Y0 + row * (BH + GAP), w: BW, h: BH,
           hp, maxHp: hp, color: PALETTE[colorIdx % PALETTE.length], spawn: 0, active: false, wobble: 0, dead: false };
}
const LAYOUTS = [
  // 0: classic grid
  (lv) => { const a = []; for (let r = 0; r < 4; r++) for (let c = 0; c < COLS; c++) a.push(mkBlock(c, r, r < 1 ? 2 : 1, r)); return a; },
  // 1: checker
  (lv) => { const a = []; for (let r = 0; r < 8; r++) for (let c = 0; c < COLS; c++) if ((r + c) % 2 === 0) a.push(mkBlock(c, r, 1 + (r < 2 ? 1 : 0), c)); return a; },
  // 2: diamond
  (lv) => { const a = []; for (let r = 0; r < 9; r++) for (let c = 0; c < COLS; c++) { const d = Math.abs(r - 4) + Math.abs(c - 3.5); if (d <= 4.5) a.push(mkBlock(c, r, d < 2 ? 3 : d < 3.5 ? 2 : 1, Math.floor(d))); } return a; },
  // 3: inverted pyramid
  (lv) => { const a = []; for (let r = 0; r < 6; r++) for (let c = 0; c < COLS; c++) if (c >= r * 0.6 && c < COLS - r * 0.6) a.push(mkBlock(c, r, 1 + (r === 0 ? 1 : 0), r + 1)); return a; },
  // 4: fortress columns
  (lv) => { const a = []; for (let r = 0; r < 9; r++) for (let c = 0; c < COLS; c++) { if (c === 0 || c === 7) a.push(mkBlock(c, r, 2, 4)); else if (r < 3 && c >= 2 && c <= 5) a.push(mkBlock(c, r, 3, 0)); else if (r === 6 && c % 2 === 1) a.push(mkBlock(c, r, 1, 2)); } return a; },
  // 5: random holes
  (lv) => { const a = []; for (let r = 0; r < 8; r++) for (let c = 0; c < COLS; c++) if (Math.random() < 0.7) a.push(mkBlock(c, r, 1 + (Math.random() < 0.3 ? 1 : 0), (r * 3 + c) % 6)); return a; },
  // 6: zigzag rows
  (lv) => { const a = []; for (let r = 0; r < 8; r++) for (let c = 0; c < COLS; c++) if ((c + (r % 2)) % 3 !== 0) a.push(mkBlock(c, r, r % 3 === 0 ? 2 : 1, r % 6)); return a; },
];
function spawnWave(wave) {
  const idx = (wave - 1) % LAYOUTS.length;
  const blocks = LAYOUTS[idx](wave);
  const extraHp = Math.floor((wave - 1) / LAYOUTS.length);   // gets tougher each full cycle
  blocks.forEach((b, i) => { b.hp += extraHp; b.maxHp = b.hp; b.spawn = -i * 0.012; });
  state.blocks = blocks;
}

// ---------------------------------------------------------------- start / reset
function startGame() {
  initAudio();
  Object.assign(state, { mode: 'playing', score: 0, time: TIME_LIMIT, wave: 1, combo: 0, maxCombo: 0, blocksBroken: 0,
                         particles: [], popups: [], banner: null, shake: 0, timeAlive: 0 });
  state.zone.x = state.zone.target = W / 2; state.zone.vx = 0;
  state.balls = [newBall(W / 2, B - R - 40, rand(-0.5, 0.5), BASE_SPEED)];
  spawnWave(1);
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  showBanner('WAVE 1', '', 1.2);
}
function endGame() {
  state.mode = 'over';
  if (state.score > state.best) { state.best = state.score; localStorage.setItem('rbb_best', state.best); }
  document.getElementById('finalScore').textContent = state.score.toLocaleString();
  document.getElementById('finalBest').textContent = 'BEST ' + state.best.toLocaleString();
  document.getElementById('finalStats').textContent =
    `WAVE ${state.wave} 到達 ／ ブロック ${state.blocksBroken} 個 ／ 最大コンボ ${state.maxCombo}`;
  document.getElementById('over').classList.remove('hidden');
}
function showBanner(text, sub, dur) { state.banner = { text, sub, t: 0, dur }; }
function popup(x, y, text, color = '#fff', size = 18) { state.popups.push({ x, y, text, color, size, t: 0 }); }

// ---------------------------------------------------------------- input
const zoneMin = L + ZONE_W / 2, zoneMax = Rgt - ZONE_W / 2;
function pointerToX(clientX) {
  const rect = canvas.getBoundingClientRect();
  return (clientX - rect.left) * (W / rect.width);
}
canvas.addEventListener('mousemove', e => { state.zone.target = clamp(pointerToX(e.clientX), zoneMin, zoneMax); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); state.zone.target = clamp(pointerToX(e.touches[0].clientX), zoneMin, zoneMax); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); state.zone.target = clamp(pointerToX(e.touches[0].clientX), zoneMin, zoneMax); }, { passive: false });
window.addEventListener('keydown', e => {
  state.keys[e.key] = true;
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if ((e.key === ' ' || e.key === 'Enter') && state.mode !== 'playing') startGame();
});
window.addEventListener('keyup', e => { state.keys[e.key] = false; });
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
function toggleMute() { muted = !muted; document.getElementById('mute').textContent = muted ? '🔇' : '🔊'; }
document.getElementById('mute').addEventListener('click', e => { initAudio(); toggleMute(); e.target.blur(); });

// ---------------------------------------------------------------- physics
function hitBlock(bl, b, nx, ny) {
  bl.hp--; bl.wobble = 1;
  state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
  const px = clamp(b.x, bl.x, bl.x + bl.w), py = clamp(b.y, bl.y, bl.y + bl.h);
  if (bl.hp <= 0) {
    bl.dead = true; state.blocksBroken++;
    const pts = 10 * bl.maxHp * multiplier();
    state.score += pts;
    popup(bl.x + bl.w / 2, bl.y + bl.h / 2, '+' + pts, bl.color.light, multiplier() > 1 ? 20 : 16);
    spawnSplinters(bl, px, py, 14);
    sfx('tile', 1);
    state.shake = Math.min(1, state.shake + 0.25);
  } else {
    spawnSplinters(bl, px, py, 5);
    sfx('tile', 0.6);
  }
  // tiny speed kick on impact keeps things lively
  setSpeed(b, clamp(ballSpeed(b) + 6, MIN_SPEED, MAX_SPEED));
}
function spawnSplinters(bl, px, py, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(60, 260);
    state.particles.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rot: rand(0, 6.28), vr: rand(-10, 10),
      w: rand(3, 8), h: rand(1.5, 3), life: rand(0.4, 0.9), t: 0, color: Math.random() < 0.5 ? bl.color.base : '#b8bfc6' });
  }
}

function stepBall(b, dt) {
  b.x += b.vx * dt; b.y += b.vy * dt;
  let hitWall = false;

  // side & top walls
  if (b.x - R < L) { b.x = L + R; if (b.vx < 0) b.vx = -b.vx; hitWall = true; }
  if (b.x + R > Rgt) { b.x = Rgt - R; if (b.vx > 0) b.vx = -b.vx; hitWall = true; }
  if (b.y - R < T) { b.y = T + R; if (b.vy < 0) b.vy = -b.vy; hitWall = true; }
  // bottom wall (never falls out)
  if (b.y + R > B) {
    b.y = B - R;
    if (b.vy > 0) {
      const z = state.zone;
      if (Math.abs(b.x - z.x) <= ZONE_W / 2) {
        // --- deflector: angle set by where the ball lands, not by incoming direction
        const t = clamp((b.x - z.x) / (ZONE_W / 2), -1, 1);
        const ang = t * ZONE_MAX_ANGLE;
        const sp = clamp(ballSpeed(b) * 1.10 + 30, MIN_SPEED, MAX_SPEED);
        b.vx = Math.sin(ang) * sp + z.vx * 0.22;     // slice from moving deflector
        b.vy = -Math.cos(ang) * sp;
        setSpeed(b, clamp(ballSpeed(b), MIN_SPEED, MAX_SPEED));
        z.flash = 1; sfx('metal', 0.9);
        state.particles.push({ x: b.x, y: B, ring: true, t: 0, life: 0.35 });
      } else {
        b.vy = -b.vy * 0.92;                          // plain steel rail, loses a bit of energy
        if (state.combo > 0) popup(b.x, B - 40, 'COMBO LOST', '#ffb08a', 13);
        state.combo = 0;
        hitWall = true;
      }
    }
  }
  if (hitWall) {
    sfx('wall', 0.5);
    // tiny realistic imperfection + avoid dead-flat loops
    const sp = ballSpeed(b), a = Math.atan2(b.vy, b.vx) + rand(-0.012, 0.012);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
  }

  // blocks
  for (const bl of state.blocks) {
    if (!bl.active || bl.dead) continue;
    const cx = clamp(b.x, bl.x, bl.x + bl.w), cy = clamp(b.y, bl.y, bl.y + bl.h);
    const dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
    if (d2 >= R * R) continue;
    let nx, ny;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; b.x = cx + nx * R; b.y = cy + ny * R; }
    else {
      const pl = b.x - bl.x, pr = bl.x + bl.w - b.x, pt = b.y - bl.y, pb = bl.y + bl.h - b.y, m = Math.min(pl, pr, pt, pb);
      if (m === pl) { nx = -1; ny = 0; b.x = bl.x - R; } else if (m === pr) { nx = 1; ny = 0; b.x = bl.x + bl.w + R; }
      else if (m === pt) { nx = 0; ny = -1; b.y = bl.y - R; } else { nx = 0; ny = 1; b.y = bl.y + bl.h + R; }
    }
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
    hitBlock(bl, b, nx, ny);
    break;
  }

  // anti-stall: if the ball is nearly horizontal / vertical for too long, nudge it
  const sp = ballSpeed(b);
  if (Math.abs(b.vy) < sp * 0.08 || Math.abs(b.vx) < sp * 0.05) b.stuckT += dt; else b.stuckT = 0;
  if (b.stuckT > 1.5) {
    const a = Math.atan2(b.vy, b.vx) + (Math.random() < 0.5 ? 0.25 : -0.25);
    b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp; b.stuckT = 0;
  }
}
function ballBallCollisions() {
  const bs = state.balls;
  for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
    const a = bs[i], b = bs[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 2 * R || d === 0) continue;
    const nx = dx / d, ny = dy / d, overlap = 2 * R - d;
    a.x -= nx * overlap / 2; a.y -= ny * overlap / 2; b.x += nx * overlap / 2; b.y += ny * overlap / 2;
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy, vn = rvx * nx + rvy * ny;
    if (vn < 0) { a.vx += vn * nx; a.vy += vn * ny; b.vx -= vn * nx; b.vy -= vn * ny; sfx('clink', 0.7); }
  }
}

function update(dt) {
  // deflector movement (keys or pointer)
  const z = state.zone;
  const kdir = (state.keys['ArrowRight'] || state.keys['d'] || state.keys['D'] ? 1 : 0) - (state.keys['ArrowLeft'] || state.keys['a'] || state.keys['A'] ? 1 : 0);
  if (kdir) z.target = clamp(z.target + kdir * 620 * dt, zoneMin, zoneMax);
  const prev = z.x;
  z.x = lerp(z.x, z.target, 1 - Math.pow(0.0005, dt));
  z.vx = lerp(z.vx, (z.x - prev) / dt, 0.4);
  z.flash = Math.max(0, z.flash - dt * 3);

  if (state.mode !== 'playing') return;
  state.time -= dt; state.timeAlive += dt;
  if (state.time <= 0) { state.time = 0; endGame(); return; }

  // block spawn animation / activation
  for (const bl of state.blocks) {
    if (bl.dead) continue;
    bl.spawn = Math.min(1, bl.spawn + dt * 2.2);
    if (bl.wobble > 0) bl.wobble = Math.max(0, bl.wobble - dt * 5);
    if (!bl.active && bl.spawn >= 1) {
      // don't activate on top of a ball
      const overlap = state.balls.some(b => b.x + R > bl.x - 2 && b.x - R < bl.x + bl.w + 2 && b.y + R > bl.y - 2 && b.y - R < bl.y + bl.h + 2);
      if (!overlap) bl.active = true;
    }
  }

  // balls: substep so fast balls never tunnel
  for (const b of state.balls) {
    const s = ballSpeed(b);
    // roll friction toward base speed
    setSpeed(b, lerp(s, baseSpeed(), 1 - Math.pow(0.75, dt)));
    const n = Math.max(1, Math.ceil(ballSpeed(b) * dt / (R * 0.5)));
    for (let i = 0; i < n; i++) stepBall(b, dt / n);
    b.trail.unshift({ x: b.x, y: b.y }); if (b.trail.length > 6) b.trail.pop();
  }
  ballBallCollisions();
  state.blocks = state.blocks.filter(bl => !bl.dead);

  // wave clear
  if (state.blocks.length === 0) {
    const bonus = 1000 + 500 * (state.wave - 1);
    state.score += bonus;
    state.time += WAVE_TIME_BONUS;
    state.wave++;
    showBanner('ALL CLEAR!', `+${bonus}  +${WAVE_TIME_BONUS}s  →  WAVE ${state.wave}`, 2.0);
    sfx('clear');
    spawnWave(state.wave);
    if (state.balls.length < MAX_BALLS) {
      state.balls.push(newBall(state.zone.x, B - R - 30, rand(-0.6, 0.6), baseSpeed()));
      popup(state.zone.x, B - 70, '+1 BALL', '#ffe9a8', 16);
    }
  }

  // particles / popups / banner
  for (const p of state.particles) {
    p.t += dt;
    if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.02, dt); p.vy *= Math.pow(0.02, dt); p.rot += p.vr * dt; }
  }
  state.particles = state.particles.filter(p => p.t < p.life);
  for (const p of state.popups) p.t += dt;
  state.popups = state.popups.filter(p => p.t < 1.0);
  if (state.banner) { state.banner.t += dt; if (state.banner.t > state.banner.dur) state.banner = null; }
  state.shake = Math.max(0, state.shake - dt * 4);
}

// ---------------------------------------------------------------- rendering
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

function drawBlock(bl) {
  const s = bl.spawn <= 0 ? 0 : 1 - Math.pow(1 - bl.spawn, 3);
  if (s <= 0) return;
  const cx = bl.x + bl.w / 2, cy = bl.y + bl.h / 2;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);

  ctx.translate(-cx, -cy);

  // steel body (sides)
  const sg = ctx.createLinearGradient(x, y, x, y + h);
  sg.addColorStop(0, '#6a7178'); sg.addColorStop(1, '#2c3136');
  ctx.fillStyle = sg; roundRect(ctx, x, y, w, h, 3); ctx.fill();
  // painted top face
  const inset = 2;

  tg.addColorStop(0, bl.color.light); tg.addColorStop(0.55, bl.color.base); tg.addColorStop(1, bl.color.dark);
  ctx.fillStyle = tg; roundRect(ctx, x + inset, y + inset, w - inset * 2, h - inset * 2 - 1, 2); ctx.fill();
  // brushed lines through the paint
  ctx.save(); roundRect(ctx, x + inset, y + inset, w - inset * 2, h - inset * 2 - 1, 2); ctx.clip(); ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++) {
    ctx.strokeStyle = i % 2 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.10)';
    ctx.beginPath(); ctx.moveTo(x, y + 3 + i * 1.7); ctx.lineTo(x + w, y + 3 + i * 1.7); ctx.stroke();
  }
  ctx.restore();
  // top edge highlight
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + 4, y + 2.5); ctx.lineTo(x + w - 4, y + 2.5); ctx.stroke();
  // damage: paint scratched down to bare metal on multi-hit blocks
  if (bl.maxHp > 1) {
    const dmg = bl.maxHp - bl.hp;
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < dmg; i++) {
      const sx = x + w * (0.25 + 0.5 * ((i * 7) % 3) / 2), sy = y + 4;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 6 + (i % 2) * 12, sy + 8); ctx.lineTo(sx + 2 - (i % 2) * 8, sy + h - 8); ctx.stroke();
      ctx.strokeStyle = 'rgba(220,226,232,.7)'; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(sx + 1, sy); ctx.lineTo(sx - 5 + (i % 2) * 12, sy + 8); ctx.lineTo(sx + 3 - (i % 2) * 8, sy + h - 8); ctx.stroke();
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.2;
    }
    // hex bolts mark reinforced blocks
    if (bl.maxHp >= 2) { hexBolt(ctx, x + 7, y + h / 2 - 1, 3, '#dfe4e8'); hexBolt(ctx, x + w - 7, y + h / 2 - 1, 3, '#dfe4e8'); }
    if (bl.maxHp >= 3) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; roundRect(ctx, x + inset + 1, y + inset + 1, w - inset * 2 - 2, h - inset * 2 - 3, 2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawZone() {
  const z = state.zone, x0 = z.x - ZONE_W / 2, y0 = B - 2, h = WALL - 4;
  // chrome plate set into the bottom rail
  ctx.save();
  const pg = ctx.createLinearGradient(x0, y0, x0 + ZONE_W, y0 + h);
  pg.addColorStop(0, '#5b6269'); pg.addColorStop(0.3, '#dfe4e8'); pg.addColorStop(0.5, '#ffffff'); pg.addColorStop(0.7, '#c2c8ce'); pg.addColorStop(1, '#4d545b');
  ctx.fillStyle = pg; roundRect(ctx, x0, y0, ZONE_W, h, 4); ctx.fill();
  // engraved center mark + tick marks showing the reflection angle map
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.2;
  for (let i = -3; i <= 3; i++) {
    const tx = z.x + i * (ZONE_W / 8);
    ctx.beginPath(); ctx.moveTo(tx, y0 + 4); ctx.lineTo(tx, y0 + (i === 0 ? 14 : 8)); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; roundRect(ctx, x0 + 1, y0 + 1, ZONE_W - 2, h - 2, 3); ctx.stroke();
  // active LED strip on the interior edge (glows when hit)
  const glow = 0.55 + z.flash * 0.45;
  ctx.shadowColor = `rgba(255,217,163,${glow})`; ctx.shadowBlur = 12 + z.flash * 18;
  ctx.fillStyle = `rgba(255,233,198,${0.8 + z.flash * 0.2})`;
  ctx.fillRect(x0 + 2, B - 3, ZONE_W - 4, 3);
  ctx.restore();
  // aim guide: faint fan showing possible exit angles
  ctx.save();
  ctx.globalAlpha = 0.12 + z.flash * 0.15;
  ctx.strokeStyle = LED_WARM; ctx.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    const t = i / 2, ang = t * ZONE_MAX_ANGLE, sx = z.x + t * ZONE_W / 2;
    ctx.beginPath(); ctx.moveTo(sx, B - 3); ctx.lineTo(sx + Math.sin(ang) * 60, B - 3 - Math.cos(ang) * 60); ctx.stroke();
  }
  ctx.restore();
}

function drawBall(b) {
  const x = b.x, y = b.y;
  // faint motion blur trail
  for (let i = b.trail.length - 1; i >= 1; i--) {
    const t = b.trail[i]; ctx.globalAlpha = 0.05 * (1 - i / b.trail.length);
    ctx.fillStyle = '#c8ccd0'; ctx.beginPath(); ctx.arc(t.x, t.y, R, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // contact shadow on the board (light comes from upper-left)
  const sg = ctx.createRadialGradient(x + 4, y + 6, R * 0.2, x + 4, y + 6, R * 1.7);
  sg.addColorStop(0, 'rgba(0,0,0,.6)'); sg.addColorStop(0.6, 'rgba(0,0,0,.28)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(x + 4, y + 6, R * 1.6, R * 1.35, 0, 0, Math.PI * 2); ctx.fill();
  // chrome body
  const bg = ctx.createRadialGradient(x - R * 0.42, y - R * 0.45, R * 0.05, x - R * 0.1, y - R * 0.1, R * 1.15);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.18, '#eef1f3'); bg.addColorStop(0.45, '#aeb5bb');
  bg.addColorStop(0.72, '#5f666d'); bg.addColorStop(0.92, '#2b3035'); bg.addColorStop(1, '#1a1d21');
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
  // environment reflection: bright "sky" on top, dark steel board on the lower half, rail glint at the bottom
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.clip();
  const eg = ctx.createLinearGradient(0, y - R, 0, y + R);
  eg.addColorStop(0, 'rgba(255,255,255,.15)'); eg.addColorStop(0.40, 'rgba(255,255,255,0)');
  eg.addColorStop(0.47, 'rgba(10,12,14,.55)'); eg.addColorStop(0.60, 'rgba(40,44,48,.45)');
  eg.addColorStop(0.85, 'rgba(20,22,25,.35)'); eg.addColorStop(1, 'rgba(220,225,230,.35)');
  ctx.fillStyle = eg; ctx.fillRect(x - R, y - R, R * 2, R * 2);
  // dark edge band (fresnel)
  const fg = ctx.createRadialGradient(x, y, R * 0.8, x, y, R);
  fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = fg; ctx.fillRect(x - R, y - R, R * 2, R * 2);
  ctx.restore();
  // sharp specular highlights
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.ellipse(x - R * 0.40, y - R * 0.44, R * 0.26, R * 0.17, -0.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.beginPath(); ctx.arc(x + R * 0.35, y + R * 0.45, R * 0.10, 0, Math.PI * 2); ctx.fill();
  // rim light along lower edge
  ctx.strokeStyle = 'rgba(255,250,240,.35)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(x, y, R - 1, 0.35, Math.PI - 0.35); ctx.stroke();
}

function drawParticles() {
  for (const p of state.particles) {
    const k = 1 - p.t / p.life;
    if (p.ring) {
      ctx.globalAlpha = k * 0.7; ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, 6 + (1 - k) * 40, Math.PI, Math.PI * 2); ctx.stroke();
      continue;
    }
    ctx.save(); ctx.globalAlpha = k; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of state.popups) {
    const k = p.t;
    ctx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ctx.font = `800 ${p.size}px -apple-system, Helvetica, Arial, sans-serif`;
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.strokeText(p.text, p.x, p.y - k * 40); ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y - k * 40);
  }
  ctx.globalAlpha = 1;
}
function drawBanner() {
  const bn = state.banner; if (!bn) return;
  const k = bn.t / bn.dur, a = k < 0.15 ? k / 0.15 : k > 0.75 ? (1 - k) / 0.25 : 1;
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const y = (T + B) / 2;
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(L, y - 44, Rgt - L, 88);
  ctx.font = '900 44px -apple-system, Helvetica, Arial, sans-serif';
  ctx.fillStyle = LED_BLUE; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4;
  ctx.strokeText(bn.text, W / 2, y - (bn.sub ? 12 : 0)); ctx.fillText(bn.text, W / 2, y - (bn.sub ? 12 : 0));
  if (bn.sub) { ctx.font = '700 20px -apple-system, Helvetica, Arial, sans-serif'; ctx.fillStyle = '#fff'; ctx.strokeText(bn.sub, W / 2, y + 24); ctx.fillText(bn.sub, W / 2, y + 24); }
  ctx.restore();
}
// HUD: white-blue LED digits on black glass
const LED_BLUE = '#dff6ff', LED_BLUE_GLOW = '#8fd8ff';
function drawHUD() {
  ctx.save();
  ctx.textBaseline = 'middle';
  const plate = (x, w, label, value, valueColor = LED_BLUE) => {
    const y = 12, h = HUD_H - 24;
    ctx.fillStyle = 'rgba(255,255,255,.03)'; roundRect(ctx, x, y, w, h, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = 1; roundRect(ctx, x + 0.5, y + 0.5, w - 1, h - 1, 3); ctx.stroke();
    ctx.textAlign = 'left'; ctx.font = '600 10px "Chakra Petch", "Helvetica Neue", Arial, sans-serif'; ctx.fillStyle = '#6f8aa6';
    ctx.fillText(label, x + 9, y + 12);
    ctx.save();
    ctx.shadowColor = valueColor === LED_BLUE ? LED_BLUE_GLOW : valueColor; ctx.shadowBlur = 10;
    ctx.textAlign = 'right'; ctx.font = '800 22px "JetBrains Mono", "Menlo", "SF Mono", Consolas, monospace'; ctx.fillStyle = valueColor;
    ctx.fillText(value, x + w - 9, y + h - 17);
    ctx.restore();
  };
  const t = Math.ceil(state.time);
  plate(12, 190, 'SCORE', state.score.toLocaleString());
  plate(212, 110, 'TIME', t.toString(), t <= 10 && state.mode === 'playing' && (Math.floor(state.time * 4) % 2 === 0) ? '#ff5a4a' : t <= 10 ? '#ffb1a8' : LED_BLUE);
  plate(332, 86, 'COMBO', 'x' + multiplier(), multiplier() > 1 ? '#ffffff' : LED_BLUE);
  plate(428, 66, 'WAVE', state.wave.toString());
  plate(504, 84, 'BEST', state.best.toLocaleString(), '#a9c8dc');
  // combo bar
  if (state.mode === 'playing') {
    const cx = 332 + 8, cw = 86 - 16, cy = HUD_H - 15;
    ctx.fillStyle = 'rgba(143,216,255,.12)'; ctx.fillRect(cx, cy, cw, 3);
    ctx.fillStyle = LED_BLUE; ctx.fillRect(cx, cy, cw * ((state.combo % 4) / 4), 3);
  }
  ctx.restore();
}

function render() {
  ctx.save();
  if (state.shake > 0) ctx.translate(rand(-1, 1) * state.shake * 4, rand(-1, 1) * state.shake * 4);
  ctx.drawImage(bgCanvas, 0, 0);
  // play area clip for blocks/balls
  ctx.save(); ctx.beginPath(); ctx.rect(L, T, Rgt - L, B - T); ctx.clip();
  for (const bl of state.blocks) drawBlock(bl);
  drawParticles();
  for (const b of state.balls) drawBall(b);
  drawPopups();
  ctx.restore();
  drawZone();
  drawBanner();
  ctx.restore();
  drawHUD();
}

// ---------------------------------------------------------------- loop & layout
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 1 / 30);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / W, vh / H) * 0.98;
  canvas.style.width = (W * s) + 'px'; canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();
